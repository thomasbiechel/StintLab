# Saison-Analysen Rennen – alle Rennen 2026 bis einschließlich Baku.
# Beim ersten Mal lädt jedes Rennen Runden, Rennleitung, Stopps, Ergebnis + Startaufstellung
# (~0,6 MB pro Rennen, danach im Cache). Späterer Stand: meeting_key auf das letzte Wochenende.
[session]
meeting_key = 1295
type = "R"

[[slides]]
analysis = "best_starters"
reel     = true          # zusätzlich als Reel: Balken bauen sich auf
title    = "WHO ARE THE BEST STARTERS SO FAR THIS SEASON ?"
subtitle = "Places gained by the exit of turn 1, compared with what each grid slot usually gains"
measure  = "turn1"       # Reihenfolge nach der ersten Kurve (Positionsdaten, ~1 MB pro Rennen); "lap1" = Linie nach Runde 1
# Messpunkt je Rennen überschreiben (Anteil der Runde), wenn die Autos dort noch nebeneinander sind:
at_frac  = { Spielberg = 0.09 }   # automatisch 7,0 % – ANT/HAM nebeneinander, bei 9 % HAM vorne (TV bestätigt)

[[slides]]
analysis = "saturday_sunday"
reel     = true
title    = "SATURDAY OR SUNDAY DRIVER?"
subtitle = "Race-pace rank vs. qualifying rank among the same drivers, average per race"
